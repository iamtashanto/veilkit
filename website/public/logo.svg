<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="logo-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="shimmer-line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <filter id="aura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 10)">
    <rect width="60" height="60" rx="14" fill="url(#logo-bg)" />
    <rect width="60" height="60" rx="14" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <circle cx="30" cy="30" r="18" fill="url(#logo-glow)" opacity="0.4" filter="url(#aura)" />

    <!-- Rotated Plate -->
    <rect x="17" y="17" width="26" height="26" rx="7" transform="rotate(45 30 30)" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1" />

    <!-- Shimmer Stroke -->
    <line x1="18" y1="42" x2="42" y2="18" stroke="url(#shimmer-line)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Sparkle -->
    <path d="M30 20 C30 25 25 30 20 30 C25 30 30 35 30 40 C30 35 35 30 40 30 C35 30 30 25 30 20 Z" fill="#ffffff" />
  </g>

  <!-- Wordmark "veilkit" -->
  <text x="84" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.04em">
    veil<tspan fill="#38bdf8">kit</tspan>
  </text>

  <!-- Version pill badge -->
  <g transform="translate(225, 26)">
    <rect width="52" height="20" rx="10" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
    <text x="26" y="14" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">v0.3.0</text>
  </g>
</svg>
