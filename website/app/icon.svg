<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Core Gradient -->
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Translucent Glass Veil Gradient -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.25)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.05)" />
    </linearGradient>

    <!-- Shimmer Wave Light Beam -->
    <linearGradient id="shimmer-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Filter for Ambient Neon Glow -->
    <filter id="aura-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg-grad)" />
  <rect width="128" height="128" rx="28" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Ambient Color Glow Spot -->
  <circle cx="64" cy="64" r="34" fill="url(#glow-grad)" opacity="0.4" filter="url(#aura-glow)" />

  <!-- Layer 1: Back Veil Shimmer Plate (Rotated Squircle) -->
  <rect x="36" y="36" width="56" height="56" rx="16" transform="rotate(45 64 64)" fill="url(#glass-grad)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" />

  <!-- Layer 2: Floating Front Hex-Veil Geometric Core -->
  <path d="M64 26 L96 44 L96 84 L64 102 L32 84 L32 44 Z" fill="url(#bg-grad)" fill-opacity="0.6" stroke="url(#glow-grad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Diagonal Shimmer Wave Stroke across Core -->
  <line x1="38" y1="90" x2="90" y2="38" stroke="url(#shimmer-grad)" stroke-width="4" stroke-linecap="round" />

  <!-- Central 4-Point Celestial Sparkle Beacon -->
  <path d="M64 42 C64 54 54 64 42 64 C54 64 64 74 64 86 C64 74 74 64 86 64 C74 64 64 54 64 42 Z" fill="#ffffff" />
  
  <!-- Tiny Secondary Satellite Glints -->
  <circle cx="86" cy="44" r="2.5" fill="#38bdf8" />
  <circle cx="42" cy="84" r="2" fill="#a855f7" />
</svg>
